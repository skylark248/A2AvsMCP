[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a2a-vs-mcp-demo"
version = "0.4.0"
description = "Comparative learning and demo platform for MCP and A2A support workflows."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.135.3",
  "jinja2>=3.1.6",
  "mcp[cli]>=1.27,<2",
  "openai>=2.30.0",
  "uvicorn>=0.30.0"
]


[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.28"
]
remote-a2a = [
  "a2a-sdk[http-server]==0.3.26"
]
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["artifacts", "frontend/dist", "frontend/node_modules", ".tmp", ".venv"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = []
